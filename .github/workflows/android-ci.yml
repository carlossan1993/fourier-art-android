name: Android CI

on:
  push:
    branches: [main, "feature/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Fetch public-domain portrait fixture
        run: |
          mkdir -p app/src/androidTest/assets
          curl --fail --location --retry 2 https://raw.githubusercontent.com/scikit-image/scikit-image/v0.25.2/skimage/data/astronaut.png -o app/src/androidTest/assets/portrait.png
          echo "88431cd9653ccd539741b555fb0a46b61558b301d4110412b5bc28b5e3ea6cb5  app/src/androidTest/assets/portrait.png" | sha256sum --check

      - name: Fetch pinned public cat fixture
        run: |
          curl --fail --location --retry 2 https://raw.githubusercontent.com/scikit-image/scikit-image/v0.25.2/skimage/data/chelsea.png -o app/src/androidTest/assets/cat.png
          echo "596aa1e7cb875eb79f437e310381d26b338a81c2da23439704a73c4651e8c4bb  app/src/androidTest/assets/cat.png" | sha256sum --check

      - name: Fetch pinned PyTorch Hub dog reference
        run: |
          curl --fail --location --retry 2 https://raw.githubusercontent.com/pytorch/hub/3b54eaafd931b0c0f3ee2df391bb4be7ba6f1ca3/images/dog.jpg -o app/src/androidTest/assets/dog.jpg
          echo "f3f87bb8ab3c26c7ecfd3ac60421d7f32b0503d1d6c5baf8bac42ed93d86351a  app/src/androidTest/assets/dog.jpg" | sha256sum --check

      - name: Build app and test APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --stacktrace

      - name: Enable KVM for Android quality test
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Test motor and photo flow on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          heap-size: 256M
          emulator-boot-timeout: 180
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back emulated -camera-front emulated
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            mkdir -p quality-output
            adb shell am instrument -w com.fourierart.app.test/androidx.test.runner.AndroidJUnitRunner > quality-output/instrumentation.txt
            cat quality-output/instrumentation.txt
            adb pull /sdcard/Android/data/com.fourierart.app/files/quality/. quality-output/
            python3 -c 'from pathlib import Path; import re; assert re.search(r"OK \(\d+ tests?\)", Path("quality-output/instrumentation.txt").read_text()), "Instrumented portrait test did not pass"'

      - name: Test preparation and camera on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          heap-size: 256M
          avd-name: stage2-api35
          emulator-boot-timeout: 180
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back emulated -camera-front emulated
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            mkdir -p quality-output/api35
            adb shell am instrument -w -e package com.fourierart.app.photo com.fourierart.app.test/androidx.test.runner.AndroidJUnitRunner > quality-output/api35/instrumentation.txt
            cat quality-output/api35/instrumentation.txt
            adb pull /sdcard/Android/data/com.fourierart.app/files/quality/. quality-output/api35/
            python3 -c 'from pathlib import Path; import re; assert re.search(r"OK \(\d+ tests?\)", Path("quality-output/api35/instrumentation.txt").read_text()), "Android 15 photo flow did not pass"'

      - name: Upload quality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portrait-quality-evidence
          path: |
            quality-output/
            app/build/reports/tests/testDebugUnitTest/
          retention-days: 3

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fourier-art-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
