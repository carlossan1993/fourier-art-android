name: Frozen visual bank

on:
  push:
    branches: ["quality/**"]
    paths:
      - "quality-bank/inputs/**"
      - "quality-bank/manifest.json"
      - "app/src/androidTest/java/com/fourierart/app/core/VisualBankTest.kt"
      - ".github/workflows/visual-bank.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Verify frozen inputs and stage test assets
        run: |
          python3 -m pip install Pillow==12.3.0
          python3 tools/stage_visual_bank.py
          mkdir -p visual-bank-output/inputs
          cp app/src/androidTest/assets/visual-bank/* visual-bank-output/inputs/
      - name: Build accepted production engine with collector
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --stacktrace
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run actual Android engine and renderer
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis_playstore
          arch: x86_64
          profile: pixel_2
          ram-size: 4096M
          heap-size: 512M
          emulator-boot-timeout: 240
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb shell dumpsys package com.google.android.gms | grep versionName
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            mkdir -p visual-bank-output
            timeout 1000s adb shell am instrument -w -e class com.fourierart.app.core.VisualBankTest com.fourierart.app.test/androidx.test.runner.AndroidJUnitRunner | tee visual-bank-output/instrumentation.txt
            adb logcat -d > visual-bank-output/logcat.txt
            adb pull /sdcard/Android/data/com.fourierart.app/files/visual-bank/. visual-bank-output/
            python3 -c 'import json; from pathlib import Path; assert len(json.loads(Path("visual-bank-output/results.json").read_text()))==30; assert "OK (1 test)" in Path("visual-bank-output/instrumentation.txt").read_text()'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frozen-visual-bank
          path: visual-bank-output/
          retention-days: 7
