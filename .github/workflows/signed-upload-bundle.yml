name: Signed upload bundle
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed-bundle:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Restore private upload key and build signed AAB
        env:
          FOURIER_UPLOAD_STORE_BASE64: ${{ secrets.FOURIER_UPLOAD_STORE_BASE64 }}
          FOURIER_UPLOAD_STORE_FILE: ${{ runner.temp }}/fourier-upload.p12
          FOURIER_UPLOAD_STORE_PASSWORD: ${{ secrets.FOURIER_UPLOAD_STORE_PASSWORD }}
          FOURIER_UPLOAD_KEY_ALIAS: ${{ secrets.FOURIER_UPLOAD_KEY_ALIAS }}
          FOURIER_UPLOAD_KEY_PASSWORD: ${{ secrets.FOURIER_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$FOURIER_UPLOAD_STORE_BASE64"
          umask 077
          printf '%s' "$FOURIER_UPLOAD_STORE_BASE64" | base64 --decode > "$FOURIER_UPLOAD_STORE_FILE"
          gradle :app:bundleRelease -PrequireReleaseSigning=true --no-daemon
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab
          sha256sum app/build/outputs/bundle/release/app-release.aab > app/build/outputs/bundle/release/SHA256SUMS
      - name: Remove temporary key
        if: always()
        run: rm -f "$RUNNER_TEMP/fourier-upload.p12"
      - uses: actions/upload-artifact@v4
        with:
          name: fourier-art-signed-upload-bundle
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/bundle/release/SHA256SUMS
          retention-days: 3
          if-no-files-found: error
